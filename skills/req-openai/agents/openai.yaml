interface:
  display_name: "开发前需求访谈"
  short_description: "分轮问清目标、流程、边界与验收，为新项目或复杂开发交付需求思维导图与功能架构图"
  icon_small: "./assets/icon.svg"
  brand_color: "#4F46E5"
  default_prompt: "用 $req 帮我把这个开发想法问清楚：每轮只问 1—3 个关键问题，不懂的地方请解释或给建议；新项目或复杂开发请在对话中展示需求思维导图与功能架构图，并在模式允许时保存两份 SVG；确认需求后再进入开发计划，不要直接写代码。"
policy:
  allow_implicit_invocation: true
